<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Hub Portal - Login</title>
    <link rel="stylesheet" href="../css/style.css?v=1790904735.40533" />
    <link rel="stylesheet" href="../css/login.css?v=1790895069.40284" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="auth-layout">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Student Login</h2>
          <p>Welcome back! Please login to your account.</p>
        </div>
        <form action="dashboard.html">
          <div class="form-group">
            <label>Email or Student ID</label>
            <input type="text" required placeholder="Enter ID or Email" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-input">
              <input
                type="password"
                id="password"
                required
                placeholder="Enter password"
              />
              <i class="fas fa-eye" id="toggle-password"></i>
            </div>
          </div>
          <div class="form-options">
            <label><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-footer">
          Don't have an account? <a href="registration.html">Register</a>
        </p>
      </div>
    </div>

    
  
    <script src="../js/api.js?v=1"></script>
    <script src="../js/utils.js?v=1"></script>
    <script src="../js/pagination.js?v=1"></script>
    <script src="../js/students.js?v=1"></script>
    <script src="../js/events.js?v=1"></script>
    <script src="../js/faqs.js?v=1"></script>
    <script src="../js/script.js?v=1790888521566"></script>

  </body>
</html>
