<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Hub Portal - Student Directory</title>
    <link rel="stylesheet" href="../css/style.css?v=1790904735.40533" />
    <link rel="stylesheet" href="../css/dashboard.css?v=1790895996.9" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img
          src="logo.png"
          alt="CHARUSAT Logo"
          style="
            height: 50px;
            background: white;
            padding: 5px;
            border-radius: 50%;
            width: 50px;
            object-fit: contain;
          "
        /> <span style="font-weight: 700; font-size: 1.3rem; color: var(--primary); letter-spacing: 0.5px; margin-left: 10px;">Student Hub</span>
        <button id="close-sidebar"><i class="fas fa-times"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="active"><i class="fas fa-home"></i> Dashboard</a>
        <a href="course.html"><i class="fas fa-book"></i> Courses</a>
        <a href="assignments.html"><i class="fas fa-tasks"></i> Assignments</a>
        <a href="attendance.html"
          ><i class="fas fa-calendar-check"></i> Attendance</a
        >
        <a href="results.html"><i class="fas fa-chart-bar"></i> Results</a>
        <a href="notice.html"><i class="fas fa-bell"></i> Notices</a>
        <a href="e-library.html"
          ><i class="fas fa-book-reader"></i> E-Library</a
        >
        <a href="fee_receipt.html"
          ><i class="fas fa-receipt"></i> Fee Receipt</a
        >
        <a href="counselling.html"
          ><i class="fas fa-comments"></i> Counselling</a
        >
        <a href="feedback.html"><i class="fas fa-comment-dots"></i> Feedback</a>
        <a href="events.html"><i class="fas fa-calendar-alt"></i> Events</a>
        <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQs</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
        <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
        <a href="login.html" class="logout-link"
          ><i class="fas fa-sign-out-alt"></i> Logout</a
        >
      </nav>
    </aside>

    <main class="main-content">
<header class="top-header" style="background: var(--card-bg); padding: 15px 30px; border-radius: 12px; margin-bottom: 30px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center;"><h2>Student Directory</h2></header>

    <div class="card" style="padding: 20px;">
        <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
            <input type="text" id="studentSearch" placeholder="Search students..." style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);" />
            <select id="studentCourseFilter" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                <option value="">All Courses</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Tech">Information Tech</option>
                <option value="Civil Eng">Civil Eng</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Electrical">Electrical</option>
            </select>
            <select id="studentYearFilter" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                <option value="">All Years</option>
                <option value="1 Year">1 Year</option>
                <option value="2 Year">2 Year</option>
                <option value="3 Year">3 Year</option>
                <option value="4 Year">4 Year</option>
            </select>
            <select id="studentSort" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                <option value="">Sort By</option>
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
                <option value="enrollment-asc">Enrollment (A-Z)</option>
                <option value="enrollment-desc">Enrollment (Z-A)</option>
                <option value="semester-asc">Semester (Ascending)</option>
                <option value="semester-desc">Semester (Descending)</option>
            </select>
        </div>
        <div id="studentInfo" style="margin-bottom: 15px; font-weight: bold; color: var(--secondary);"></div>
        <div id="studentContainer"></div>
        <div id="studentPagination"></div>
    </div>

</main>
    
  
    <script type="module" src="../js/main.js"></script>
    <script src="../js/script.js?v=1790888521566"></script>

  </body>
</html>
